name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

jobs:
  build-dist:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  build-exe:
    name: Build standalone Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # mcp[cli] pulls in typer, which PyInstaller's `--collect-all mcp` imports
      # during analysis (mcp.cli). Without it the build aborts.
      - run: pip install . "mcp[cli]" pyinstaller
      - run: >
          pyinstaller --onefile --name hwinfo-mcp --paths src
          --collect-all mcp src/hwinfo_mcp/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/hwinfo-mcp.exe

  release:
    name: Publish GitHub release
    needs: [build-dist, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            artifacts/dist/* artifacts/exe/hwinfo-mcp.exe
